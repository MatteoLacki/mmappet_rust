[package]
name = "mmappet"
version = "0.2.1"
edition = "2021"
description = "Memory-mapped columnar dataset library"
license = "MIT"
authors = ["Mateusz Krzysztof Lacki", "Claude Code ;)"]
repository = "https://github.com/MatteoLacki/mmappet_rust.git"
keywords = ["binary", "memmaped-df"]
categories = ["development-tools", "data-structures", "science", "database"]
readme = "README.md"
include = ["src/**", "README.md", "Cargo.toml"]

[lib]
name = "mmappet"
path = "src/lib.rs"

[[bin]]
name = "mmappet-cli"
path = "src/bin/mmappet_cli.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:anyhow", "ndarray"]
ndarray = ["dep:ndarray"]

[dependencies]
anyhow = { version = "1", optional = true }
bytemuck = "1.13"
clap = { version = "4.5.50", features = ["derive"], optional = true }
half = { version = "2.7.1", features = ["bytemuck"] }
memmap2 = "0.9"
ndarray = { version = "0.15", optional = true }
num-complex = { version = "0.4", features = ["bytemuck"] }
thiserror = "1.0"

[package.metadata.docs.rs]
all-features = true
